name: deploy

on:
  push:
    branches: [main]
  # shortcut: контент подтягивается по расписанию и вручную, а не по событию из devplus; добавить repository_dispatch, если задержка мешает.
  # GitHub отключает scheduled workflows в публичном репо после 60 дней без активности (по моим данным, проверить); тогда запускай вручную (workflow_dispatch).
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: hhaakkimm/devplus
          ref: main
          path: devplus
          sparse-checkout: |
            content
            apps/web/public/content
          persist-credentials: false

      - run: cp -R devplus/apps/web/public/content public/content

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test

      - run: pnpm build
        env:
          CONTENT_DIR: ${{ github.workspace }}/devplus/content

      - run: node scripts/smoke-out.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
